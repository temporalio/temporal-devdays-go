name: Landing page

# Checks site/public is current with site/labs.json. The pages are generated by
# `node site/build.mjs --og` and committed, social cards included. Nothing is
# deployed: GitHub Pages is off for this org. To host it elsewhere, set `base`
# in labs.json to the new URL, rebuild, and serve site/public as static files.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The committed pages match labs.json
        run: |
          node site/build.mjs
          git diff --exit-code -- site/public || { echo "Run 'node site/build.mjs --og' and commit site/public."; exit 1; }
