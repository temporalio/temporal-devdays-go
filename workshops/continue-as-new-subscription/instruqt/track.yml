title: Continue-As-New (Go)
teaser: A subscription bills every cycle until the Temporal Service terminates it.
  Add Continue-As-New and watch it finish. Ten minutes.
description: |-
  Every Workflow Execution has an Event History, and that history has a hard
  ceiling. A subscription that bills every cycle will reach it, and the Temporal
  Service will terminate it.

  Long before that, the Service suggests a rollover. Continue-As-New is how you
  take it: close the current run and start a fresh one with the same Workflow
  ID, a new Run ID, and a new, short history.

  One Challenge, about ten minutes:

  1. Run the subscription and watch the Service terminate it.
  2. Add Continue-As-New when the Service suggests it, carrying the billing count.
  3. Run it again and watch it finish across a chain of runs.

  Every Check runs your code and tells you what is missing and where.

  **Level:** Advanced. You should already know what a Workflow, an Activity and
  a Worker are.
