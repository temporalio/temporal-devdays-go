slug: nexus-decouple-monolith-go
title: 'Nexus: Decouple a Monolith (Go)'
teaser: Split a payments monolith into two independently deployable services connected
  by Nexus.
description: |-
  Payments and Compliance share one Worker and one Namespace. A bug in compliance
  code at 3 AM takes payments down with it.

  You will put a Nexus boundary between them without changing a line of business
  logic. Define the shared Service contract, implement the handlers on the
  Compliance side, register them on a Worker, then swap the caller from an
  Activity to a Nexus client. One call changes at the call site.

  Then break it on purpose. Stop the Compliance Worker mid-operation and watch the
  payment Workflow wait instead of fail.

  Built on the Temporal Go SDK. Five challenges, three of them hands-on.
